<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaorORG © Netfix - Instant Install</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .description {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: left;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-direction: column;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            line-height: 1.6;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.5;
        }

        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .step {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            text-align: left;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo" style="background-image: url('./icons/icon128.png');"></div>
            <h1>LaorORG © Netfix</h1>
            <p class="subtitle">Instant Auto-Install</p>
        </div>

        <div class="description">
            <strong>Click once to install.</strong><br>
            The extension loads instantly into your browser!
        </div>

        <div class="warning">
            ⚠️ <strong>Important:</strong> Using unauthorized Netflix cookies may violate their Terms of Service. Use only on accounts you own.
        </div>

        <div class="buttons">
            <button class="btn btn-primary" onclick="installNow()" id="installBtn">
                <span id="btn-icon">⚡</span>
                <span id="btn-text">Install Extension Now</span>
            </button>
        </div>

        <div id="status" class="status"></div>

        <div class="footer">
            <p><strong>Version:</strong> 1.0.0 • © 2026 LaorORG</p>
        </div>
    </div>

    <script>
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = message;
            statusEl.className = `status ${type}`;
        }

        async function installNow() {
            const btn = document.getElementById('installBtn');
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');

            btn.disabled = true;
            btnIcon.innerHTML = '<span class="spinner"></span>';
            btnText.textContent = 'Installing...';

            try {
                // Check if browser is Chrome or Edge
                const ua = navigator.userAgent;
                const isChrome = /Chrome/.test(ua) && /Google Inc/.test(navigator.vendor);
                const isEdge = /Edg/.test(ua);

                if (!isChrome && !isEdge) {
                    throw new Error('Please use Chrome or Edge browser');
                }

                showStatus('⏳ Step 1: Downloading extension...', 'info');

                // Try multiple download sources in order
                const downloadUrls = [
                    'https://cdn.jsdelivr.net/gh/SV5-Y3S1/LaorORG-Netfix---Extension@main/LaorORG-Netfix-Extension.zip',
                    'https://github.com/SV5-Y3S1/LaorORG-Netfix---Extension/releases/download/v1.0.0/LaorORG-Netfix-Extension.zip'
                ];

                let blob = null;
                let lastError = null;

                for (const url of downloadUrls) {
                    try {
                        const response = await fetch(url, { 
                            method: 'GET',
                            mode: 'cors'
                        });
                        
                        if (response.ok) {
                            blob = await response.blob();
                            break;
                        }
                    } catch (e) {
                        lastError = e;
                        continue;
                    }
                }

                if (!blob) {
                    throw new Error('Failed to download from all sources. Please try again or use manual installation.');
                }

                showStatus('⏳ Step 2: Processing extension...', 'info');

                // Save to Downloads folder
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'LaorORG-Netfix-Extension.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // Wait a bit before revoking
                setTimeout(() => URL.revokeObjectURL(url), 100);

                showStatus(
                    '<strong style="font-size: 16px;">✓ Downloaded Successfully!</strong><br><br>' +
                    '<div class="step">' +
                    '<strong>📍 Next - Follow These Steps:</strong><br>' +
                    '1. <strong>Extract</strong> the <code>LaorORG-Netfix-Extension.zip</code> file<br>' +
                    '2. Open <strong>' + (isEdge ? 'edge://extensions/' : 'chrome://extensions/') + '</strong><br>' +
                    '3. Enable <strong>"Developer mode"</strong> (toggle in top-right)<br>' +
                    '4. Click <strong>"Load unpacked"</strong><br>' +
                    '5. Select the <strong>extracted folder</strong><br>' +
                    '6. ✓ <strong>Done!</strong> Extension installed!' +
                    '</div><br>' +
                    '<strong>Then:</strong> Open Netflix and click the LaorORG icon!',
                    'success'
                );

                btnText.textContent = 'Check Downloads!';
                btnIcon.innerHTML = '✓';

                // Auto-open extensions page
                setTimeout(() => {
                    window.open(isEdge ? 'edge://extensions/' : 'chrome://extensions/', '_blank');
                }, 1000);

            } catch (error) {
                showStatus(
                    '<strong>✗ Error:</strong> ' + error.message + '<br><br>' +
                    '<strong>Alternative:</strong> Download manually from<br>' +
                    '<a href="https://github.com/SV5-Y3S1/LaorORG-Netfix---Extension/releases/download/v1.0.0/LaorORG-Netfix-Extension.zip" target="_blank">GitHub</a>',
                    'error'
                );

                btn.disabled = false;
                btnIcon.innerHTML = '⚡';
                btnText.textContent = 'Try Again';
            }
        }
    </script>
</body>
</html>
