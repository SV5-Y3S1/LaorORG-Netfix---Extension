<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaorORG © Netfix - Install Extension</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .description {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: left;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-direction: column;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #999;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-link {
            background: #e8e8e8;
            color: #333;
            text-decoration: none;
        }

        .btn-link:hover {
            background: #d8d8d8;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            line-height: 1.6;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.5;
        }

        code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 13px;
        }

        a {
            color: #667eea;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .steps {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            text-align: left;
            border-left: 4px solid #667eea;
            font-size: 13px;
            line-height: 1.8;
        }

        ol {
            margin-left: 20px;
        }

        li {
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Λ</div>
            <h1>LaorORG © Netfix</h1>
            <p class="subtitle">Install Extension</p>
        </div>

        <div class="description">
            <strong>One-click installation.</strong><br>
            Download the extension and load it into your browser.
        </div>

        <div class="warning">
            ⚠️ <strong>Important:</strong> Using unauthorized Netflix cookies may violate their Terms of Service. Use only on accounts you own.
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="installBtn" type="button">
                <span id="btn-icon">⚡</span>
                <span id="btn-text">Download Extension</span>
            </button>
            <a href="https://github.com/SV5-Y3S1/LaorORG-Netfix---Extension/releases/download/v1.0.0/LaorORG-Netfix-Extension.zip" class="btn btn-link" download>
                <span>📥</span>
                <span>Direct GitHub Link</span>
            </a>
        </div>

        <div id="status" class="status"></div>

        <div class="footer">
            <p><strong>Version:</strong> 1.0.0 • © 2026 LaorORG</p>
        </div>
    </div>

    <script>
        document.getElementById('installBtn').addEventListener('click', installNow);

        function showStatus(message, type) {
            var statusEl = document.getElementById('status');
            statusEl.innerHTML = message;
            statusEl.className = 'status ' + type;
        }

        function installNow() {
            var btn = document.getElementById('installBtn');
            var btnIcon = document.getElementById('btn-icon');
            var btnText = document.getElementById('btn-text');

            btn.disabled = true;
            btnIcon.textContent = '';
            btnIcon.innerHTML = '<span class="spinner"></span>';
            btnText.textContent = 'Downloading...';

            var ua = navigator.userAgent;
            var isChrome = ua.indexOf('Chrome') > -1 && ua.indexOf('Google Inc') > -1;
            var isEdge = ua.indexOf('Edg') > -1;

            if (!isChrome && !isEdge) {
                showStatus('Please use Chrome or Edge browser', 'error');
                btn.disabled = false;
                btnIcon.textContent = '⚡';
                btnText.textContent = 'Download Extension';
                return;
            }

            showStatus('Downloading extension...', 'info');

            var downloadUrl = 'https://github.com/SV5-Y3S1/LaorORG-Netfix---Extension/releases/download/v1.0.0/LaorORG-Netfix-Extension.zip';

            fetch(downloadUrl, {method: 'GET'})
                .then(function(response) {
                    if (!response.ok) throw new Error('Download failed');
                    return response.blob();
                })
                .then(function(blob) {
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'LaorORG-Netfix-Extension.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    var extPage = isEdge ? 'edge://extensions/' : 'chrome://extensions/';
                    showStatus(
                        '<strong>✓ Download started!</strong><br><br>' +
                        '<div class="steps">' +
                        '<ol>' +
                        '<li><strong>Extract</strong> LaorORG-Netfix-Extension.zip</li>' +
                        '<li>Open <code>' + extPage + '</code></li>' +
                        '<li>Enable <strong>Developer mode</strong></li>' +
                        '<li>Click <strong>Load unpacked</strong></li>' +
                        '<li>Select extracted folder</li>' +
                        '<li>Done!</li>' +
                        '</ol>' +
                        '</div>',
                        'success'
                    );

                    btnText.textContent = 'Downloaded!';
                    btnIcon.textContent = '✓';

                    setTimeout(function() {
                        window.open(extPage, '_blank');
                    }, 1000);
                })
                .catch(function(error) {
                    showStatus(
                        '<strong>Download error:</strong> ' + error.message + '<br><br>' +
                        'Use the <strong>Direct GitHub Link</strong> button instead',
                        'error'
                    );
                    btn.disabled = false;
                    btnIcon.textContent = '⚡';
                    btnText.textContent = 'Try Again';
                });
        }
    </script>
</body>
</html>
